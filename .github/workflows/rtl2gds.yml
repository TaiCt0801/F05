name: F05 RTL-to-GDS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "rtl2gds/**"
      - ".github/workflows/rtl2gds.yml"

jobs:
  rtl2gds:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LibreLane
        run: |
          python -m pip install --upgrade pip
          python -m pip install librelane

      - name: Run LibreLane
        working-directory: rtl2gds
        run: |
          python -m librelane --dockerized config.json

      - name: Check for GDS output
        if: always()
        run: |
          find rtl2gds -type f \( -name "*.gds" -o -name "*.log" \) -print
          if [ "${{ job.status }}" = "success" ]; then
            if ! find rtl2gds -type f -name "*.gds" -print -quit | grep -q .; then
              echo "ERROR: Flow succeeded but no GDS file was found."
              exit 1
            fi
          fi

      - name: Upload RTL-to-GDS results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: F05-rtl2gds-results
          path: rtl2gds/runs/
          if-no-files-found: warn
          retention-days: 14
