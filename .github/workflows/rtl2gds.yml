
name: F05 RTL-to-GDS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "rtl2gds/**"
      - ".github/workflows/rtl2gds.yml"

permissions:
  contents: read

jobs:
  rtl2gds:
    name: Run RTL-to-GDS
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LibreLane
        run: |
          python -m pip install --upgrade pip
          python -m pip install librelane

      - name: Check configuration and RTL
        working-directory: rtl2gds
        run: |
          test -f config.json
          test -f src/F05.v
          python -m json.tool config.json
          echo "Configuration and RTL files exist."

      - name: Run LibreLane
        working-directory: rtl2gds
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python -m librelane --dockerized --docker-no-tty config.json 2>&1 | tee librelane.log

      - name: List generated files
        if: always()
        run: |
          echo "=== GDS files ==="
          find rtl2gds -type f -name "*.gds" -print || true
          echo "=== Logs ==="
          find rtl2gds -type f -name "*.log" -print || true
          echo "=== Run directory ==="
          find rtl2gds/runs -maxdepth 4 -type f -print 2>/dev/null | head -200 || true

      - name: Upload RTL-to-GDS results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: F05-rtl2gds-results
          path: |
            rtl2gds/runs/
            rtl2gds/librelane.log
          if-no-files-found: warn
          retention-days: 14
